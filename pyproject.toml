[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demon-bluff-assistant"
version = "0.3.3"
description = "Fair-play decision companion for the Demon Bluff demo"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "openai>=1.109,<3",
  "numpy>=2,<2.3",
  "onnxruntime>=1.27,<2",
  "opencv-python>=4.12,<5",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "pywin32>=311; platform_system == 'Windows'",
  "rapidocr==3.9.1",
  "uvicorn>=0.35,<1",
  "z3-solver>=4.15,<5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pyinstaller>=6.15,<7",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[project.scripts]
demon-bluff-assistant = "demon_bluff_assistant.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demon_bluff_assistant = ["static/*", "role_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
